<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bishop England Science Olympiad Team Manager</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg: #0a1a0f; --bg-card: #111f16; --bg-surface: #162a1c; --bg-hover: #1c3424;
  --green-primary: #1e7a34; --green-light: #27a349; --green-bright: #34d058;
  --gold: #c9a227; --gold-light: #e6c94a; --text: #e8f5eb; --text-muted: #7fa88a;
  --text-dim: #4a6b55; --border: #1e3a28; --border-light: #2a4a35;
  --danger: #e05252; --warning: #f59e0b; --info: #38bdf8; --success: #34d058;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, sans-serif; min-height: 100vh; }
a { color: var(--green-light); text-decoration: none; }
button { cursor: pointer; font-family: inherit; }
input, select, textarea { font-family: inherit; }
h1,h2,h3,h4,h5,h6 { font-weight: 600; }
.hidden { display: none !important; }
#app { display: flex; min-height: 100vh; }
#sidebar { width: 240px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; transition: transform 0.2s; overflow-y: auto; }
#main { margin-left: 240px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
#header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
#content { flex: 1; padding: 24px; }
.sidebar-logo { padding: 20px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.sidebar-logo img { width: 40px; height: 40px; object-fit: contain; border-radius: 6px; }
.sidebar-logo-text { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }
.sidebar-logo-sub { font-size: 11px; color: var(--text-muted); }
.nav-list { list-style: none; padding: 12px 0; flex: 1; }
.nav-item { display: block; }
.nav-link { display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: var(--text-muted); font-size: 14px; font-weight: 500; transition: all 0.15s; border-left: 3px solid transparent; cursor: pointer; }
.nav-link:hover { background: var(--bg-hover); color: var(--text); }
.nav-link.active { background: rgba(30,122,52,0.2); color: var(--green-bright); border-left-color: var(--green-bright); }
.nav-link svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); }
.sync-status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
.sync-dot.synced { background: var(--success); }
.sync-dot.syncing { background: var(--warning); animation: pulse 1s infinite; }
.sync-dot.offline { background: var(--danger); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.header-left { display: flex; align-items: center; gap: 16px; }
.page-title { font-size: 18px; font-weight: 700; }
.header-right { display: flex; align-items: center; gap: 12px; }
.team-toggle { display: flex; background: var(--bg-surface); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
.team-btn { padding: 6px 16px; font-size: 13px; font-weight: 600; border: none; background: transparent; color: var(--text-muted); transition: all 0.15s; cursor: pointer; }
.team-btn.active { background: var(--green-primary); color: white; }
.saved-indicator { font-size: 12px; color: var(--success); opacity: 0; transition: opacity 0.3s; }
.saved-indicator.show { opacity: 1; }
.hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; padding: 4px; cursor: pointer; }
.hamburger span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: all 0.2s; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.stat-card { display: flex; flex-direction: column; gap: 6px; }
.stat-value { font-size: 28px; font-weight: 700; color: var(--green-bright); }
.stat-label { font-size: 13px; color: var(--text-muted); }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; border: none; transition: all 0.15s; cursor: pointer; }
.btn-primary { background: var(--green-primary); color: white; }
.btn-primary:hover { background: var(--green-light); }
.btn-secondary { background: var(--bg-surface); color: var(--text); border: 1px solid var(--border-light); }
.btn-secondary:hover { background: var(--bg-hover); }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: #c04040; }
.btn-gold { background: var(--gold); color: #000; }
.btn-gold:hover { background: var(--gold-light); }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
.btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 4px; }
.btn-icon { padding: 6px; border-radius: 6px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
.btn-icon:hover { background: var(--bg-hover); color: var(--text); }
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.badge-green { background: rgba(52,208,88,0.15); color: var(--green-bright); }
.badge-gold { background: rgba(201,162,39,0.2); color: var(--gold-light); }
.badge-red { background: rgba(224,82,82,0.15); color: var(--danger); }
.badge-yellow { background: rgba(245,158,11,0.15); color: var(--warning); }
.badge-blue { background: rgba(56,189,248,0.15); color: var(--info); }
.badge-gray { background: rgba(74,107,85,0.3); color: var(--text-muted); }
.badge-purple { background: rgba(167,139,250,0.15); color: #a78bfa; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.form-input { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: 8px; padding: 9px 12px; color: var(--text); font-size: 14px; transition: border-color 0.15s; }
.form-input:focus { outline: none; border-color: var(--green-primary); }

.form-select option { background: var(--bg-card); }

.form-textarea:focus { outline: none; border-color: var(--green-primary); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
.modal { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 16px; width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto; }
.modal-lg { max-width: 740px; }
.modal-xl { max-width: 900px; }
.modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg-card); z-index: 2; border-radius: 16px 16px 0 0; }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
.close-btn { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; line-height: 1; padding: 2px 6px; border-radius: 4px; }
.close-btn:hover { background: var(--bg-hover); color: var(--text); }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-sm { width: 28px; height: 28px; font-size: 11px; }
.avatar-lg { width: 72px; height: 72px; font-size: 24px; }
.members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.member-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; transition: all 0.15s; cursor: pointer; }
.member-card:hover { border-color: var(--green-primary); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,0.3); }
.member-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }

.member-card-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }

.events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.event-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; transition: all 0.15s; cursor: pointer; }

.event-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.event-name { font-size: 14px; font-weight: 600; line-height: 1.3; }
.event-card-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.event-card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border); }
.event-members-row { display: flex; }
.event-members-row .avatar-sm { margin-left: -8px; border: 2px solid var(--bg-card); }
.event-members-row .avatar-sm:first-child { margin-left: 0; }
.coverage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.coverage-item { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
.coverage-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.coverage-dot.none { background: var(--danger); }
.coverage-dot.one { background: var(--warning); }
.coverage-dot.full { background: var(--success); }
.table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead { background: var(--bg-surface); }
th { padding: 10px 14px; text-align: left; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; cursor: pointer; user-select: none; }
th:hover { color: var(--text); }
td { padding: 10px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: rgba(28,52,36,0.5); }
.stars { display: flex; gap: 2px; }
.star { color: var(--text-dim); font-size: 16px; cursor: pointer; transition: color 0.1s; }
.star.filled { color: var(--gold); }
.star:hover { color: var(--gold-light); }
.activity-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.activity-item:last-child { border-bottom: none; }
.activity-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green-primary); margin-top: 5px; flex-shrink: 0; }
.activity-text { font-size: 13px; line-height: 1.5; }
.activity-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.announcement-card { background: var(--bg-card); border-left: 4px solid var(--border); border-radius: 0 12px 12px 0; padding: 16px 20px; margin-bottom: 12px; border-right: 1px solid var(--border); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); transition: all 0.15s; }
.announcement-card.high { border-left-color: var(--danger); }
.announcement-card.medium { border-left-color: var(--warning); }
.announcement-card.low { border-left-color: var(--info); }
.announcement-card.pinned { border-left-color: var(--gold) !important; background: rgba(201,162,39,0.05); }
.announcement-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.announcement-title { font-size: 15px; font-weight: 600; }
.announcement-body { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
.announcement-meta { font-size: 11px; color: var(--text-dim); margin-top: 8px; }
.accordion-item { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.accordion-header { padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--bg-surface); transition: background 0.15s; font-weight: 600; font-size: 14px; }
.accordion-header:hover { background: var(--bg-hover); }
.accordion-arrow { transition: transform 0.2s; color: var(--text-muted); font-size: 18px; }
.accordion-item.open .accordion-arrow { transform: rotate(180deg); }
.accordion-body { display: none; padding: 16px 18px; background: var(--bg-card); border-top: 1px solid var(--border); }
.accordion-item.open .accordion-body { display: block; }
.resource-link { display: flex; align-items: center; gap: 8px; color: var(--info); font-size: 13px; padding: 4px 0; transition: color 0.1s; }
.resource-link:hover { color: var(--green-bright); }
.tip-item { font-size: 13px; color: var(--text-muted); padding: 4px 0 4px 16px; position: relative; line-height: 1.5; }
.tip-item::before { content: "\2022"; position: absolute; left: 4px; color: var(--green-primary); }
.countdown-card { background: linear-gradient(135deg, rgba(30,122,52,0.2), rgba(201,162,39,0.1)); border: 1px solid var(--green-primary); border-radius: 12px; padding: 24px; text-align: center; }
.countdown-label { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
.countdown-blocks { display: flex; justify-content: center; gap: 20px; }
.countdown-block { text-align: center; min-width: 60px; }
.countdown-num { font-size: 40px; font-weight: 800; color: var(--gold); line-height: 1; }
.countdown-unit { font-size: 11px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty-state h3 { font-size: 16px; margin-bottom: 8px; color: var(--text-dim); }
.empty-state p { font-size: 13px; }
.tournament-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
.tournament-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.tournament-name { font-size: 15px; font-weight: 700; }
.placement-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.placement-item { background: var(--bg-surface); border-radius: 8px; padding: 8px 12px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
.placement-num { font-weight: 700; color: var(--gold); }
.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }

.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
.page-header h2 { font-size: 20px; }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.section-title { font-size: 15px; font-weight: 600; }
.settings-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 18px; }
.settings-section h3 { font-size: 14px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 10px; padding: 12px 18px; font-size: 13px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 10px; animation: slideIn 0.2s ease; max-width: 320px; pointer-events: all; }
.toast.success { border-left: 4px solid var(--success); }
.toast.error { border-left: 4px solid var(--danger); }
.toast.warning { border-left: 4px solid var(--warning); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.tabs { display: flex; gap: 2px; background: var(--bg-surface); border-radius: 8px; padding: 3px; margin-bottom: 18px; width: fit-content; }
.tab-btn { padding: 6px 16px; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
.tab-btn.active { background: var(--green-primary); color: white; }
.photo-upload-area { display: flex; align-items: center; gap: 14px; }
.photo-preview { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-light); }
.divider { height: 1px; background: var(--border); margin: 4px 0; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.mt-1 { margin-top: 4px; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }
.mt-4 { margin-top: 16px; }
.mb-2 { margin-bottom: 8px; }
.text-sm { font-size: 13px; }
.text-xs { font-size: 11px; }
.text-muted { color: var(--text-muted); }
.text-dim { color: var(--text-dim); }
.text-gold { color: var(--gold); }
.text-green { color: var(--green-bright); }
.text-danger { color: var(--danger); }
.font-bold { font-weight: 700; }
.w-full { width: 100%; }
.dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.welcome-banner { background: linear-gradient(135deg, rgba(30,122,52,0.25) 0%, rgba(201,162,39,0.1) 100%); border: 1px solid var(--green-primary); border-radius: 16px; padding: 28px; margin-bottom: 24px; display: flex; align-items: center; gap: 20px; }
.welcome-banner img { width: 80px; height: 80px; object-fit: contain; border-radius: 10px; }
.welcome-text h2 { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.welcome-text p { font-size: 14px; color: var(--text-muted); }
.next-tournament-card { background: linear-gradient(135deg, rgba(30,122,52,0.15), rgba(201,162,39,0.08)); border: 1px solid var(--border-light); border-radius: 12px; padding: 18px; }
.quick-actions { display: flex; gap: 10px; flex-wrap: wrap; }
@media print { #sidebar, #header, .btn, .filter-bar, .quick-actions { display: none !important; } #main { margin-left: 0; } .member-card { break-inside: avoid; } }
@media (max-width: 768px) { #sidebar { transform: translateX(-100%); } #sidebar.open { transform: translateX(0); } #main { margin-left: 0; } .hamburger { display: flex; } .form-row, .form-row-3 { grid-template-columns: 1fr; } .members-grid, .events-grid { grid-template-columns: 1fr; } #content { padding: 14px; } .countdown-blocks { gap: 10px; } .countdown-num { font-size: 28px; } .dashboard-grid { grid-template-columns: 1fr; } }

::-webkit-scrollbar-thumb:hover { background: var(--green-primary); }
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; }
.sidebar-overlay.show { display: block; }
</style>

let saveDebounce = null;

// ==================== FIREBASE ====================
function initFirebase() {
  const fc = state.settings.firebase;
  if (!fc || !fc.apiKey || !fc.projectId) { updateSyncStatus('offline'); return; }
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp({
        apiKey: fc.apiKey, authDomain: fc.authDomain, projectId: fc.projectId,
        storageBucket: fc.storageBucket, messagingSenderId: fc.messagingSenderId, appId: fc.appId
      });
    }
    db = firebase.firestore();
    updateSyncStatus('synced');
    setupFirestoreListeners();
    toast('Firebase connected', 'success');
  } catch(e) { console.error(e); updateSyncStatus('offline'); toast('Firebase error: ' + e.message, 'error'); }
}

function updateSyncStatus(status) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  if (!dot || !lbl) return;
  dot.className = 'sync-dot ' + status;
  const labels = { synced: 'Synced', syncing: 'Syncing...', offline: 'localStorage' };
  lbl.textContent = labels[status] || 'localStorage';
}

function teamPath() { return 'teams/be_scioly_2026'; }

async function syncToFirestore() {
  if (!db) return;
  updateSyncStatus('syncing');
  try {
    const batch = db.batch();
    const tp = teamPath();
    batch.set(db.doc(tp + '/meta/config'), { teamName: state.settings.teamName, season: state.settings.season, coachName: state.settings.coachName, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    await batch.commit();
    state.members.forEach(async m => { await db.doc(tp + '/members/' + m.id).set(m); });
    Object.keys(state.assignments).forEach(async eid => { await db.doc(tp + '/assignments/' + eid).set({ members: state.assignments[eid] }); });
    state.practiceLogs.forEach(async l => { await db.doc(tp + '/progress/' + l.id).set(l); });
    state.tournaments.forEach(async t => { await db.doc(tp + '/tournaments/' + t.id).set(t); });
    state.announcements.forEach(async a => { await db.doc(tp + '/announcements/' + a.id).set(a); });
    updateSyncStatus('synced');
  } catch(e) { console.error(e); updateSyncStatus('offline'); }
}

function setupFirestoreListeners() {
  if (!db) return;
  const tp = teamPath();
  db.collection(tp + '/members').onSnapshot(snap => {
    state.members = snap.docs.map(d => d.data());
    renderCurrentPage();
  });
  db.collection(tp + '/announcements').onSnapshot(snap => {
    state.announcements = snap.docs.map(d => d.data());
    if (currentPage === 'announcements') renderCurrentPage();
  });
}

// ==================== STATE MANAGEMENT ====================
function loadState() {
  try {
    const saved = localStorage.getItem(STATE_KEY);
    if (saved) { const parsed = JSON.parse(saved); state = Object.assign(state, parsed); }
  } catch(e) { console.error('Load error:', e); }
}

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
    showSaved();
    if (db) { clearTimeout(window._fsync); window._fsync = setTimeout(syncToFirestore, 2000); }
  } catch(e) { console.error('Save error:', e); }
}

function showSaved() {
  const el = document.getElementById('savedIndicator');
  if (!el) return;
  el.classList.add('show');
  clearTimeout(window._savedTimer);
  window._savedTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

function debouncedSave() { clearTimeout(saveDebounce); saveDebounce = setTimeout(saveState, 300); }

// ==================== NAVIGATION ====================
let currentPage = 'dashboard';
const pageTitles = {
  dashboard: 'Dashboard', roster: 'Roster', events: 'Events', assignments: 'Assignments',
  practicelog: 'Practice Log', tournaments: 'Tournament Log', announcements: 'Announcements',
  resources: 'Resources', settings: 'Settings'
};

function navigate(page) {
  currentPage = page;
  document.getElementById('pageTitle').textContent = pageTitles[page] || page;
  document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.page === page));
  if (window.innerWidth <= 768) { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('show'); }
  renderCurrentPage();
}

function renderCurrentPage() {
  const content = document.getElementById('content');
  if (!content) return;
  const renders = {
    dashboard: renderDashboard, roster: renderRoster, events: renderEvents,
    assignments: renderAssignments, practicelog: renderPracticeLog, tournaments: renderTournaments,
    announcements: renderAnnouncements, resources: renderResources, settings: renderSettings
  };
  if (renders[currentPage]) renders[currentPage](content);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}

  state.team = team;

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function today() { return new Date().toISOString().split('T')[0]; }

function teamMembers() {
  return state.members.filter(m => m.team === state.team || m.team === 'Both');
}

function getMemberById(id) { return state.members.find(m => m.id === id); }

function getEventById(id) { return EVENTS_DATA.find(e => e.id === id); }

function getAssignments(eventId) {
  const a = state.assignments[eventId] || [];
  return a.filter(mid => { const m = getMemberById(mid); return m && (m.team === state.team || m.team === 'Both'); });
}

function getMemberHours(memberId) {
  return state.practiceLogs.filter(l => l.memberId === memberId).reduce((s, l) => s + (parseFloat(l.hours) || 0), 0);
}

function getMemberEvents(memberId) {
  return EVENTS_DATA.filter(e => (state.assignments[e.id] || []).includes(memberId)).length;
}

function getEventHours(eventId) {
  return state.practiceLogs.filter(l => l.eventId === eventId).reduce((s, l) => s + (parseFloat(l.hours) || 0), 0);
}

function avatarColor(name) {
  const colors = ['#1e7a34','#c9a227','#38bdf8','#a78bfa','#f472b6','#fb923c','#34d058','#e05252'];
  let h = 0; for (let c of name) h = ((h << 5) - h) + c.charCodeAt(0);
  return colors[Math.abs(h) % colors.length];
}

function avatarHtml(member, cls = 'avatar') {
  if (member && member.photo) return `<div class="${cls}"><img src="${member.photo}" alt="${member.firstName}"></div>`;
  const initials = member ? (member.firstName[0] + (member.lastName[0] || '')).toUpperCase() : '?';
  const color = member ? avatarColor(member.firstName + member.lastName) : '#1e7a34';
  return `<div class="${cls}" style="background:${color}20;color:${color};border:2px solid ${color}40">${initials}</div>`;
}

function roleBadge(role) {
  const map = { Captain:'badge-gold', 'Co-Captain':'badge-yellow', Member:'badge-green', Alternate:'badge-gray' };
  return `<span class="badge ${map[role]||'badge-gray'}">${role||'Member'}</span>`;
}

function coverageBadge(count) {
  if (count === 0) return `<span class="badge badge-red">0 Members</span>`;
  if (count === 1) return `<span class="badge badge-yellow">1 Member</span>`;
  return `<span class="badge badge-green">${count} Members</span>`;
}

function categoryBadge(cat) {
  const map = { 'Life Science':'badge-green', 'Earth Science':'badge-blue', 'Physical Science':'badge-purple', 'Technology':'badge-gold', 'Inquiry':'badge-yellow' };
  return `<span class="badge ${map[cat]||'badge-gray'}">${cat}</span>`;
}

function typeBadge(type) {
  const map = { Test:'badge-blue', Build:'badge-gold', Hybrid:'badge-purple' };
  return `<span class="badge ${map[type]||'badge-gray'}">${type}</span>`;
}

function starsHtml(eventId, current) {
  let h = '';
  for (let i = 1; i <= 5; i++) h += `<span class="star ${i <= (current||0) ? 'filled' : ''}" onclick="setRating('${eventId}',${i})">&#9733;</span>`;
  return `<div class="stars">${h}</div>`;
}

function setRating(eventId, rating) {
  state.eventRatings[eventId] = rating;
  saveState();
  renderCurrentPage();
}

function toast(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = { success: '&#10003;', error: '&#10007;', warning: '&#9888;' };
  t.innerHTML = `<span>${icons[type]||''}</span><span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 3500);
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ==================== ROSTER ====================
function renderRoster(content) {
  const members = [...teamMembers()];
  const sort = sortConfig;
  members.sort((a, b) => {
    let av = a[sort.key] || '', bv = b[sort.key] || '';
    if (sort.key === 'hours') { av = getMemberHours(a.id); bv = getMemberHours(b.id); }
    if (sort.key === 'grade') { av = parseInt(av)||0; bv = parseInt(bv)||0; }
    return sort.dir === 'asc' ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
  });

  const memberCards = members.length > 0 ? members.map(m => {
    const hours = getMemberHours(m.id);
    const events = getMemberEvents(m.id);
    return `<div class="member-card" onclick="openEditMember('${m.id}')">
      <div class="member-card-header">
        ${avatarHtml(m)}
        <div class="member-card-info">
          <h3>${escHtml(m.firstName)} ${escHtml(m.lastName)}</h3>
          <p>Grade ${m.grade} &bull; ${m.team}</p>
          <div style="margin-top:4px">${roleBadge(m.role)}</div>
        </div>
      </div>
      ${m.email ? `<div class="text-sm text-muted" style="margin-bottom:8px">&#9993; ${escHtml(m.email)}</div>` : ''}
      ${m.notes ? `<div class="text-xs text-dim" style="margin-bottom:8px;line-height:1.4">${escHtml(m.notes.substring(0,80))}${m.notes.length>80?'...':''}</div>` : ''}
      <div class="member-card-stats">
        <div class="member-stat"><strong>${events}</strong>Events</div>
        <div class="member-stat"><strong>${hours.toFixed(1)}h</strong>Practice</div>
      </div>
    </div>`;
  }).join('') : `<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">&#128101;</div><h3>No members on ${state.team} team</h3><p>Add members or switch teams using the toggle above.</p></div>`;

  content.innerHTML = `
    <div class="page-header">
      <h2>Roster &mdash; ${state.team} Team (${members.length} members)</h2>
      <div style="display:flex;gap:10px">
        <button class="btn btn-secondary btn-sm" onclick="window.print()">&#128438; Print</button>
        <button class="btn btn-primary" onclick="openAddMember()">&#43; Add Member</button>
      </div>
    </div>
    <div class="filter-bar">
      <input class="form-input" placeholder="&#128269; Search members..." oninput="filterRoster(this.value)" id="rosterSearch">
      <select class="form-select" onchange="sortRoster(this.value)">
        <option value="name">Sort: Name</option>
        <option value="grade">Sort: Grade</option>
        <option value="hours">Sort: Hours</option>
        <option value="role">Sort: Role</option>
      </select>
      <select class="form-select" onchange="filterRosterRole(this.value)">
        <option value="">All Roles</option>
        <option>Captain</option><option>Co-Captain</option><option>Member</option><option>Alternate</option>
      </select>
    </div>
    <div class="members-grid" id="membersGrid">${memberCards}</div>`;
}

function filterRoster(query) {
  const cards = document.querySelectorAll('.member-card');
  const q = query.toLowerCase();
  cards.forEach(c => { c.style.display = c.textContent.toLowerCase().includes(q) ? '' : 'none'; });
}
function sortRoster(key) { sortConfig = { key, dir: sortConfig.key === key && sortConfig.dir === 'asc' ? 'desc' : 'asc' }; renderCurrentPage(); }
function filterRosterRole(role) {
  const cards = document.querySelectorAll('.member-card');
  cards.forEach(c => { c.style.display = !role || c.textContent.includes(role) ? '' : 'none'; });
}

function handlePhotoUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    window._photoData = e.target.result;
    const preview = document.getElementById('photoPreview');
    const placeholder = document.getElementById('photoPlaceholder');
    if (preview) { preview.src = e.target.result; preview.style.display = ''; }
    if (placeholder) placeholder.style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function saveMember() {
  const fn = document.getElementById('addFirstName').value.trim();
  const ln = document.getElementById('addLastName').value.trim();
  if (!fn || !ln) { toast('First and last name required', 'error'); return; }
  const member = {
    id: uid(), firstName: fn, lastName: ln,
    grade: document.getElementById('addGrade').value,
    role: document.getElementById('addRole').value,
    team: document.getElementById('addTeam').value,
    email: document.getElementById('addEmail').value.trim(),
    notes: document.getElementById('addNotes').value.trim(),
    photo: window._photoData || null,
    createdAt: today()
  };
  state.members.push(member);
  saveState();
  closeModal();
  renderCurrentPage();
  toast(`${fn} ${ln} added to ${member.team} team`, 'success');
}

function updateMember(id) {
  const idx = state.members.findIndex(m => m.id === id);
  if (idx === -1) return;
  const fn = document.getElementById('editFirstName').value.trim();
  const ln = document.getElementById('editLastName').value.trim();
  if (!fn || !ln) { toast('Name required', 'error'); return; }
  state.members[idx] = { ...state.members[idx], firstName: fn, lastName: ln,
    grade: document.getElementById('editGrade').value, role: document.getElementById('editRole').value,
    team: document.getElementById('editTeam').value, email: document.getElementById('editEmail').value.trim(),
    notes: document.getElementById('editNotes').value.trim(), photo: window._photoData !== undefined ? window._photoData : state.members[idx].photo };
  saveState(); closeModal(); renderCurrentPage();
  toast('Member updated', 'success');
}

function deleteMember(id) {
  if (!confirm('Delete this member? This cannot be undone.')) return;
  state.members = state.members.filter(m => m.id !== id);
  Object.keys(state.assignments).forEach(eid => { state.assignments[eid] = (state.assignments[eid]||[]).filter(mid => mid !== id); });
  state.practiceLogs = state.practiceLogs.filter(l => l.memberId !== id);
  saveState(); closeModal(); renderCurrentPage();
  toast('Member deleted', 'success');
}

function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

function renderEvents(content) {
  const filterSearch = document.getElementById('evtSearch')?.value || '';
  const filterCat = document.getElementById('evtCat')?.value || '';
  const filterType = document.getElementById('evtType')?.value || '';
  const filterCov = document.getElementById('evtCov')?.value || '';

  let events = EVENTS_DATA;
  if (filterSearch) events = events.filter(e => e.name.toLowerCase().includes(filterSearch.toLowerCase()));
  if (filterCat) events = events.filter(e => e.category === filterCat);
  if (filterType) events = events.filter(e => e.type === filterType);
  if (filterCov === '0') events = events.filter(e => getAssignments(e.id).length === 0);
  if (filterCov === '1') events = events.filter(e => getAssignments(e.id).length === 1);
  if (filterCov === '2') events = events.filter(e => getAssignments(e.id).length >= 2);

  const eventCards = events.map(e => {
    const assigned = getAssignments(e.id).map(mid => getMemberById(mid)).filter(Boolean);

    return `<div class="event-card" onclick="openEventDetail('${e.id}')">

        <option ${filterCat==='Inquiry'?'selected':''}>Inquiry</option>

        <option value="">All Types</option>

        <option ${filterType==='Build'?'selected':''}>Build</option>
        <option ${filterType==='Hybrid'?'selected':''}>Hybrid</option>
      </select>
      <select class="form-select" id="evtCov" onchange="renderCurrentPage()">
        <option value="">All Coverage</option>
        <option value="0" ${filterCov==='0'?'selected':''}>No Members</option>

// ==================== ASSIGNMENTS ====================
function renderAssignments(content) {
  const members = teamMembers();

  const rows = EVENTS_DATA.map(e => {
    const assigned = getAssignments(e.id).map(mid => getMemberById(mid)).filter(Boolean);
    const available = members.filter(m => !(state.assignments[e.id]||[]).includes(m.id));
    return `<tr>
      <td><strong>${e.name}</strong><br><span class="text-xs text-dim">${e.category}</span></td>
      <td>${typeBadge(e.type)}</td>
      <td>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          ${assigned.map(m => `<div style="display:flex;align-items:center;gap:4px;background:var(--bg-surface);padding:3px 8px;border-radius:6px;border:1px solid var(--border)">
            ${avatarHtml(m,'avatar avatar-sm')}
            <span style="font-size:12px">${m.firstName} ${m.lastName}</span>
            <button class="btn btn-xs" style="background:transparent;border:none;color:var(--danger);padding:2px;line-height:1" onclick="removeAssignment('${e.id}','${m.id}')" title="Remove">&#10007;</button>
          </div>`).join('')}
          ${assigned.length === 0 ? '<span class="text-xs text-dim">None assigned</span>' : ''}
        </div>
      </td>
      <td>${coverageBadge(assigned.length)}</td>
      <td>
        ${assigned.length < 2 && available.length > 0 ?
          `<select class="form-select" style="height:32px;font-size:12px;padding:4px 8px" onchange="addAssignment('${e.id}',this)">
            <option value="">+ Assign member</option>
            ${available.map(m => `<option value="${m.id}">${m.firstName} ${m.lastName}</option>`).join('')}
          </select>` :
          assigned.length >= 2 ? '<span class="text-xs text-muted">Max 2 assigned</span>' :
          '<span class="text-xs text-dim">No available members</span>'}
      </td>
    </tr>`;
  }).join('');

  // Summary stats
  const noMember = EVENTS_DATA.filter(e => getAssignments(e.id).length === 0).length;
  const oneMember = EVENTS_DATA.filter(e => getAssignments(e.id).length === 1).length;
  const twoMember = EVENTS_DATA.filter(e => getAssignments(e.id).length >= 2).length;

  content.innerHTML = `
    <div class="page-header">
      <h2>Assignments &mdash; ${state.team} Team</h2>
      <div style="display:flex;gap:12px">
        <div class="card" style="padding:10px 16px;display:flex;gap:12px">
          <span class="text-sm"><span style="color:var(--danger)">&#11044;</span> ${noMember} empty</span>
          <span class="text-sm"><span style="color:var(--warning)">&#11044;</span> ${oneMember} partial</span>
          <span class="text-sm"><span style="color:var(--success)">&#11044;</span> ${twoMember} full</span>
        </div>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Event</th><th>Type</th><th>Assigned Members</th><th>Coverage</th><th>Add Member</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function addAssignment(eventId, select) {
  const memberId = select.value;
  if (!memberId) return;
  if (!(state.assignments[eventId])) state.assignments[eventId] = [];
  if (state.assignments[eventId].length >= 2) { toast('Maximum 2 members per event', 'warning'); select.value = ''; return; }
  if (state.assignments[eventId].includes(memberId)) { toast('Member already assigned', 'warning'); select.value = ''; return; }
  state.assignments[eventId].push(memberId);
  saveState();
  renderCurrentPage();
  const m = getMemberById(memberId);
  const e = getEventById(eventId);
  toast(`${m ? m.firstName + ' ' + m.lastName : 'Member'} assigned to ${e ? e.name : eventId}`, 'success');
}

function removeAssignment(eventId, memberId) {
  if (!state.assignments[eventId]) return;
  state.assignments[eventId] = state.assignments[eventId].filter(id => id !== memberId);
  saveState(); renderCurrentPage();
  const m = getMemberById(memberId); const e = getEventById(eventId);
  toast(`${m ? m.firstName : 'Member'} removed from ${e ? e.name : eventId}`, 'success');
}

// ==================== PRACTICE LOG ====================

              <select class="form-select" id="logMember">

              </select>

            <div class="form-group"><label class="form-label">Date</label><input class="form-input" type="date" id="logDate" value="${today()}"></div>

            <div class="form-group"><label class="form-label">Session Type</label>
              <select class="form-select" id="logType">
                <option>Study</option><option>Practice</option><option>Test</option><option>Build</option>
              </select>
            </div>

      </select>
      <input class="form-input" type="date" id="plFrom" value="${filterFrom}" onchange="renderCurrentPage()" placeholder="From date">
      <input class="form-input" type="date" id="plTo" value="${filterTo}" onchange="renderCurrentPage()" placeholder="To date">
      <select class="form-select" id="plType" onchange="renderCurrentPage()">

function submitLog() {
  const memberId = document.getElementById('logMember').value;
  const eventId = document.getElementById('logEvent').value;
  const hours = parseFloat(document.getElementById('logHours').value);
  const date = document.getElementById('logDate').value;
  if (!memberId || !eventId || !hours || !date) { toast('Please fill in member, event, hours, and date', 'error'); return; }
  if (hours <= 0 || hours > 24) { toast('Hours must be between 0.25 and 24', 'error'); return; }
  state.practiceLogs.push({
    id: uid(), memberId, eventId, hours, date,
    sessionType: document.getElementById('logType').value,
    notes: document.getElementById('logNotes').value.trim()
  });
  saveState(); renderCurrentPage();
  const m = getMemberById(memberId); const e = getEventById(eventId);
  toast(`Logged ${hours}h for ${m ? m.firstName : 'member'} on ${e ? e.name : 'event'}`, 'success');
}

function deleteLog(id) {
  if (!confirm('Delete this log entry?')) return;
  state.practiceLogs = state.practiceLogs.filter(l => l.id !== id);
  saveState(); renderCurrentPage(); toast('Log entry deleted', 'success');
}

function sortLogs(key) {
  const logs = [...state.practiceLogs];
  sortConfig = { key, dir: sortConfig.key === key && sortConfig.dir === 'asc' ? 'desc' : 'asc' };
  renderCurrentPage();
}

function saveTournament() {
  const name = document.getElementById('tName').value.trim();
  if (!name) { toast('Tournament name required', 'error'); return; }
  const placements = { overall: document.getElementById('tOverall').value.trim() };
  EVENTS_DATA.forEach(e => { const v = document.getElementById('tp_' + e.id)?.value.trim(); if (v) placements[e.id] = v; });
  state.tournaments.push({ id: uid(), name, date: document.getElementById('tDate').value, type: document.getElementById('tType').value, location: document.getElementById('tLocation').value.trim(), team: document.getElementById('tTeam').value, placements });
  saveState(); closeModal(); renderCurrentPage();
  toast('Tournament added', 'success');
}

function updateTournament(id) {
  const idx = state.tournaments.findIndex(t => t.id === id);
  if (idx === -1) return;
  const name = document.getElementById('tName').value.trim();
  if (!name) { toast('Tournament name required', 'error'); return; }
  const placements = { overall: document.getElementById('tOverall').value.trim() };
  EVENTS_DATA.forEach(e => { const v = document.getElementById('tp_' + e.id)?.value.trim(); if (v) placements[e.id] = v; });
  state.tournaments[idx] = { ...state.tournaments[idx], name, date: document.getElementById('tDate').value, type: document.getElementById('tType').value, location: document.getElementById('tLocation').value.trim(), team: document.getElementById('tTeam').value, placements };
  saveState(); closeModal(); renderCurrentPage();
  toast('Tournament updated', 'success');
}

function deleteTournament(id) {
  if (!confirm('Delete this tournament?')) return;
  state.tournaments = state.tournaments.filter(t => t.id !== id);
  saveState(); closeModal(); renderCurrentPage();
  toast('Tournament deleted', 'success');
}


// ==================== ANNOUNCEMENTS ====================
function renderAnnouncements(content) {
  const sorted = [...state.announcements].sort((a,b) => {
    if (a.pinned && !b.pinned) return -1;
    if (!a.pinned && b.pinned) return 1;
    const prio = { high: 3, medium: 2, low: 1 };
    if ((prio[a.priority]||1) !== (prio[b.priority]||1)) return (prio[b.priority]||1) - (prio[a.priority]||1);
    return new Date(b.date) - new Date(a.date);
  });

  const cards = sorted.map(a => `<div class="announcement-card ${a.pinned ? 'pinned' : (a.priority||'low')}">
    <div class="announcement-header">
      <div>
        ${a.pinned ? '<span class="badge badge-gold" style="margin-right:8px">&#128204; Pinned</span>' : ''}
        <span class="badge ${a.priority==='high'?'badge-red':a.priority==='medium'?'badge-yellow':'badge-blue'}">${a.priority||'low'}</span>
        <span class="announcement-title" style="margin-left:8px">${escHtml(a.title)}</span>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-xs btn-secondary" onclick="togglePin('${a.id}')">${a.pinned ? 'Unpin' : '&#128204; Pin'}</button>
        <button class="btn btn-xs btn-secondary" onclick="openEditAnnouncement('${a.id}')">&#9998;</button>
        <button class="btn btn-xs btn-danger" onclick="deleteAnnouncement('${a.id}')">&#128465;</button>
      </div>
    </div>
    <div class="announcement-body">${escHtml(a.body)}</div>
    <div class="announcement-meta">Posted: ${fmtDate(a.date)} ${a.updatedAt ? '&bull; Updated: ' + fmtDate(a.updatedAt) : ''}</div>
  </div>`).join('');

  content.innerHTML = `
    <div class="page-header">
      <h2>Announcements</h2>
      <button class="btn btn-primary" onclick="openAddAnnouncement()">&#43; Post Announcement</button>
    </div>
    ${sorted.length > 0 ? cards : `<div class="empty-state"><div class="empty-state-icon">&#128276;</div><h3>No announcements yet</h3><p>Post your first announcement above.</p></div>`}`;
}

}

function openEditAnnouncement(id) {
  const a = state.announcements.find(x => x.id === id);
  if (!a) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header"><span class="modal-title">Edit Announcement</span><button class="close-btn" onclick="closeModal()">&times;</button></div>
        <div class="modal-body">
          <div class="form-group"><label class="form-label">Title *</label><input class="form-input" id="aTitle" value="${escHtml(a.title)}"></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Priority</label><select class="form-select" id="aPriority"><option value="low" ${a.priority==='low'?'selected':''}>Low</option><option value="medium" ${a.priority==='medium'?'selected':''}>Medium</option><option value="high" ${a.priority==='high'?'selected':''}>High</option></select></div>
            <div class="form-group"><label class="form-label">Date</label><input class="form-input" type="date" id="aDate" value="${a.date}"></div>
          </div>
          <div class="form-group"><label class="form-label">Body *</label><textarea class="form-textarea" id="aBody" style="min-height:120px">${escHtml(a.body)}</textarea></div>
          <div class="form-group" style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" id="aPinned" ${a.pinned?'checked':''} style="width:18px;height:18px;accent-color:var(--gold)"><label class="form-label" for="aPinned" style="cursor:pointer;margin:0">Pin to top</label></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="updateAnnouncement('${id}')">Save Changes</button>
        </div>
      </div>
    </div>`;
}

function saveAnnouncement() {
  const title = document.getElementById('aTitle').value.trim();
  const body = document.getElementById('aBody').value.trim();
  if (!title || !body) { toast('Title and body required', 'error'); return; }
  state.announcements.push({ id: uid(), title, body, priority: document.getElementById('aPriority').value, date: document.getElementById('aDate').value, pinned: document.getElementById('aPinned').checked });
  saveState(); closeModal(); renderCurrentPage();
  toast('Announcement posted', 'success');
}

function updateAnnouncement(id) {
  const idx = state.announcements.findIndex(a => a.id === id);
  if (idx === -1) return;
  const title = document.getElementById('aTitle').value.trim();
  const body = document.getElementById('aBody').value.trim();
  if (!title || !body) { toast('Title and body required', 'error'); return; }
  state.announcements[idx] = { ...state.announcements[idx], title, body, priority: document.getElementById('aPriority').value, date: document.getElementById('aDate').value, pinned: document.getElementById('aPinned').checked, updatedAt: today() };
  saveState(); closeModal(); renderCurrentPage();
  toast('Announcement updated', 'success');
}

function togglePin(id) {
  const a = state.announcements.find(x => x.id === id);
  if (a) { a.pinned = !a.pinned; saveState(); renderCurrentPage(); }
}

function deleteAnnouncement(id) {
  if (!confirm('Delete this announcement?')) return;
  state.announcements = state.announcements.filter(a => a.id !== id);
  saveState(); renderCurrentPage(); toast('Announcement deleted', 'success');
}

function saveGeneralSettings() {
  state.settings.teamName = document.getElementById('setTeamName').value.trim() || 'Bishop England';
  state.settings.coachName = document.getElementById('setCoachName').value.trim();
  state.settings.season = document.getElementById('setSeason').value.trim() || '2025-2026';
  saveState(); toast('Settings saved', 'success');
}

function saveFirebaseConfig() {
  state.settings.firebase = {
    apiKey: document.getElementById('fbApiKey').value.trim(),
    authDomain: document.getElementById('fbAuthDomain').value.trim(),
    projectId: document.getElementById('fbProjectId').value.trim(),
    storageBucket: document.getElementById('fbStorageBucket').value.trim(),
    messagingSenderId: document.getElementById('fbMessagingSenderId').value.trim(),
    appId: document.getElementById('fbAppId').value.trim()
  };
  saveState();
  initFirebase();
  renderCurrentPage();
}

function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `be_scioly_backup_${today()}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('Data exported', 'success');
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!confirm('Import this data? This will replace all current data.')) return;
      state = Object.assign(state, imported);
      saveState(); renderCurrentPage();
      toast('Data imported successfully', 'success');
    } catch(err) { toast('Invalid JSON file', 'error'); }
  };
  reader.readAsText(file);
}

function clearAllData() {
  if (!confirm('Delete ALL data? This cannot be undone!')) return;
  if (!confirm('Are you absolutely sure? All members, logs, and tournaments will be lost.')) return;
  state = { team: state.team, members: [], assignments: {}, practiceLogs: [], tournaments: [], announcements: [], eventRatings: {}, settings: state.settings };
  saveState(); renderCurrentPage();
  toast('All data cleared', 'warning');
}

// ==================== INIT ====================
function init() {
  loadState();
  if (state.team) { document.getElementById('btnJV').classList.toggle('active', state.team === 'JV'); document.getElementById('btnVarsity').classList.toggle('active', state.team === 'Varsity'); }
  initFirebase();
  navigate('dashboard');

  // Start countdown updater
  setInterval(() => {
    if (currentPage === 'dashboard') renderCurrentPage();
  }, 60000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
